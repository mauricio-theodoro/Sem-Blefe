spring:
  application:
    name: sem-blefe-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:semblefe}}
    username: ${POSTGRES_USER:semblefe_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.hibernate.SQL: INFO

semblefe:
  legal-documents:
    terms-of-use-version: "${TERMS_OF_USE_VERSION:1.0}"
    privacy-policy-version: "${PRIVACY_POLICY_VERSION:1.0}"
  identity:
    email-verification:
      token-validity: "${EMAIL_VERIFICATION_TOKEN_VALIDITY:PT30M}"
      resend-cooldown: "${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}"
